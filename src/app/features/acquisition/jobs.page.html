<main class="page jobs-page"><qai-page-header title="Jobs" subtitle="Canonical AgentJob execution across campaigns and containers."><button class="button-quiet" (click)="load()">↻ Refresh</button></qai-page-header><p class="error" *ngIf="error">{{error}}</p><section class="jobs-panel"><div class="job-row head"><span>TYPE</span><span>JOB</span><span>CAMPAIGN</span><span>STATUS</span><span>RESULTS</span></div><div class="job-row" *ngFor="let j of jobs"><span>{{j.type||j.taskType||'campaign.execute'}}</span><code>{{j.id}}</code><span>{{j.campaignId||'—'}}</span><strong [class]="status(j.status).toLowerCase()">{{j.status}}</strong><span>{{j.discoveredCount||0}} discovered · {{j.qualifiedCount||0}} qualified · {{j.emailsSentCount||0}} sent</span></div><p class="empty" *ngIf="!loading&&!jobs.length">No jobs recorded yet.</p></section></main>
