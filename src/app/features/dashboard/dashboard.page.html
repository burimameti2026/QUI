<main class="hub-content">
  <div class="hub-alert" *ngIf="error"><strong>Live data notice</strong><span>{{ error }}</span></div>

  <section class="hub-intro">
    <h1>Good morning, {{ sessionName }}</h1>
    <p>Pick a workspace to get started</p>
  </section>

  <section class="workspace-grid" *ngIf="loaded" aria-label="Workspaces">
    <button type="button" class="workspace-tile leads" (click)="go('/discover')">
      <div class="workspace-main">
        <span class="workspace-icon">L</span>
        <div><h2>Leads</h2><p>Find, qualify and work every deal — prospecting, CRM, pipeline, campaigns.</p></div>
      </div>
      <div class="workspace-footer"><span class="workspace-stat">{{ acquisition.discovered || 0 }} new this week</span><span class="workspace-arrow">→</span></div>
    </button>

    <button type="button" class="workspace-tile cms" (click)="go('/renova/content')">
      <div class="workspace-main">
        <span class="workspace-icon">C</span>
        <div><h2>CMS</h2><p>Manage the Renova content site, promotions and the product catalog.</p></div>
      </div>
      <div class="workspace-footer"><span class="workspace-stat">{{ plans.length }} drafts pending</span><span class="workspace-arrow">→</span></div>
    </button>

    <button type="button" class="workspace-tile finance" (click)="go('/billing')">
      <div class="workspace-main">
        <span class="workspace-icon">F</span>
        <div><h2>Finance</h2><p>Invoices, orders and enterprise operations in one place.</p></div>
      </div>
      <div class="workspace-footer"><span class="workspace-stat">{{ financeStat }}</span><span class="workspace-arrow">→</span></div>
    </button>

    <button type="button" class="workspace-tile admin" (click)="go('/platform')">
      <div class="workspace-main">
        <span class="workspace-icon">A</span>
        <div><h2>Admin</h2><p>Users, roles, platform, tenants, security and audit.</p></div>
      </div>
      <div class="workspace-footer"><span class="workspace-stat">{{ queuedMessages }} pending approvals</span><span class="workspace-arrow">→</span></div>
    </button>
  </section>

  <div class="hub-loading" *ngIf="!loaded">Loading workspace status…</div>
</main>
